<!DOCTYPE html>
<html lang="pt-br">
<!-- Cabeçalho do documento HTML, onde estão as informações sobre o documento. -->
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real & Dolar</title>
    <!-- Link para o arquivo de estilo CSS -->
    <link rel="stylesheet" href="css/dolar&real.css">
 </head> 
 <!-- Corpo do documento HTML, onde está o conteúdo visível da página. -->
 <body>

    <main><!-- Bloco principal do conteúdo da página. -->
        <h1>Conversor de Moedas</h1>
        
                          <!--imagem do conversor-->
        <img src="./imagens/dolar&real.png" alt="Dolar e Real" width="100px">
        <br>
                       <!-- Seção para o campo de entrada do conversor. -->
        <section>       
            <span class="cur">   USD$</span>
            <input id="usd" type="text" placeholder="  Dolar">
        </section>
                       
        <section>
            <span class="cur" >  BRL$</span>
            <input id="brl" type="text" placeholder="  Real">
        </section>
<br>
        <!--Abrindo tabela USD E BRL-->
        <table border="1" style="color: black; background-color: white;">
            <tr>
                <th>USD</th>
                <th>BRL</th>
            </tr>
            <tr>
                <td id="dolar" >0.00</td>
                <td id="real">0.00</td>
            </tr>
        </table>
        <br>
   <!-- gráfico -->
<canvas id="grafico"></canvas>

    </main>

    <footer>
        Feito por Rodrigo
    </footer>
               <!--Adicionando Java.sc -->

<!-- biblioteca -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Java.js -->
<script src="js/dolar&real.js"></script>

 </body>
</html>
